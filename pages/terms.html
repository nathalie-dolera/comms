<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terms &amp; Conditions - Portfolio</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        @media (max-width: 900px) {
            #terms-cards-container {
                grid-template-columns: 1fr !important;
            }
            #terms-cards-container .paper-note {
                max-width: 100% !important;
            }
        }
    </style>
</head>

<body>
    <div class="page-background"></div>

    <!-- Navigation -->
    <nav class="top-nav">
        <a href="../index.html">Home</a>
        <a href="about.html">About</a>
        <a href="output.html">Output</a>
        <a href="feedback.html">Feedback</a>
        <a href="terms.html" class="active">T &amp; C</a>
        <a href="form.html">Form</a>
        <a href="tracker.html">Tracker &amp; Slots</a>
    </nav>

    <div class="terms-page" style="padding-top: 85px; padding-bottom: 70px;">

        <!-- Centered Header -->
        <div class="terms-header" style="text-align: center; margin-bottom: 35px;">
            <h1 class="terms-title" id="client-terms-title"
                style="font-family: 'Playfair Display', serif; font-size: 46px; color: var(--paper-cream); font-weight: 900; margin: 0; display: block;">
                Terms &amp; Conditions</h1>
            <p class="paper-subtitle" id="client-terms-subtitle"
                style="font-size: 15px; font-style: italic; color: var(--rose-light); margin-top: 10px; letter-spacing: 0.5px; text-align: center;">
                Please read carefully before requesting a commission</p>
        </div>

        <!-- 2-Column Responsive Grid (1 Left, 2 Right, 3 Left, 4 Right...) -->
        <div id="terms-cards-container"
            style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; max-width: 1050px; width: 100%; margin: 0 auto; align-items: stretch; box-sizing: border-box; padding: 0 20px;">
            <!-- Rendered via JS -->
        </div>

        <!-- Agreement Footnote / Disclaimer (Text box matching the full length of the 2 columns) -->
        <div id="client-terms-disclaimer-wrapper" style="display: none; max-width: 1050px; width: 100%; margin: 30px auto 0 auto; box-sizing: border-box; padding: 0 20px;">
            <div class="paper-note" style="margin-bottom: 0; background: #fdfaf6; border: 1px solid #dcd0c2; box-shadow: 0 4px 15px rgba(0,0,0,0.12); padding: 25px 32px; border-radius: 6px; text-align: center;">
                <h4 id="client-terms-disclaimer-title" style="display: none; font-family: 'Special Elite', monospace; font-size: 14px; text-transform: uppercase; color: #4a0e0b; letter-spacing: 2px; margin: 0 0 10px 0; border-bottom: 1px dashed #dcd0c2; padding-bottom: 10px;"></h4>
                <p id="client-terms-disclaimer" style="font-family: 'Special Elite', monospace; font-size: 14px; text-transform: uppercase; color: #6b1814; letter-spacing: 1.5px; line-height: 1.7; margin: 0;">
                </p>
            </div>
        </div>

    </div>

    <script src="../js/storage.js"></script>
    <script>
        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function getTermsData(data) {
            if (!data) return null;
            if (Array.isArray(data)) {
                return {
                    pageTitle: 'Terms & Conditions',
                    pageSubtitle: 'Please read carefully before requesting a commission',
                    footnote: '',
                    footnoteTitle: '',
                    sections: data
                };
            }
            if (data.sections && Array.isArray(data.sections)) {
                return {
                    pageTitle: data.pageTitle || 'Terms & Conditions',
                    pageSubtitle: data.pageSubtitle !== undefined ? data.pageSubtitle : 'Please read carefully before requesting a commission',
                    footnote: data.footnote || '',
                    footnoteTitle: data.footnoteTitle || '',
                    sections: data.sections
                };
            }
            return null;
        }

        function renderTermsPage() {
            const rawData = Storage.get(Storage.KEYS.TERMS, null);
            const data = getTermsData(rawData);
            if (!data) return;

            // Render Page Title & Subtitle
            const titleEl = document.getElementById('client-terms-title');
            const subEl = document.getElementById('client-terms-subtitle');
            const fnEl = document.getElementById('client-terms-disclaimer');
            const fnTitleEl = document.getElementById('client-terms-disclaimer-title');
            const fnWrapper = document.getElementById('client-terms-disclaimer-wrapper');

            if (titleEl && data.pageTitle) titleEl.textContent = data.pageTitle;
            if (subEl && data.pageSubtitle !== undefined) subEl.textContent = data.pageSubtitle;

            // Render Footnote only if non-empty
            if (data.footnote && data.footnote.trim()) {
                if (fnEl) fnEl.textContent = data.footnote.trim();
                if (fnTitleEl) {
                    if (data.footnoteTitle && data.footnoteTitle.trim()) {
                        fnTitleEl.textContent = data.footnoteTitle.trim();
                        fnTitleEl.style.display = 'block';
                    } else {
                        fnTitleEl.style.display = 'none';
                    }
                }
                if (fnWrapper) fnWrapper.style.display = 'block';
            } else {
                if (fnWrapper) fnWrapper.style.display = 'none';
            }

            const container = document.getElementById('terms-cards-container');
            if (!container || !data.sections || !data.sections.length) return;

            const validSections = data.sections.filter(s => (s.title && s.title.trim()) || (s.items && s.items.length));
            if (!validSections.length) return;

            const isOdd = validSections.length % 2 === 1;
            container.innerHTML = validSections.map((sec, idx) => {
                const isLastOdd = isOdd && idx === validSections.length - 1;
                const orphanStyle = isLastOdd ? 'grid-column: 1 / -1; justify-self: center; width: 100%; max-width: calc(50% - 12px);' : '';
                return `
                <div class="paper-note" style="margin-bottom: 0; background: #fdfaf6; border: 1px solid #dcd0c2; box-shadow: 0 4px 15px rgba(0,0,0,0.12); padding: 30px 34px; border-radius: 6px; height: 100%; min-height: 280px; box-sizing: border-box; display: flex; flex-direction: column; ${orphanStyle}">
                    ${sec.title ? `<h3 style="font-family:'Special Elite', monospace; font-size: 16px; text-transform: uppercase; color: #6b1814; letter-spacing: 2px; margin-bottom: 8px; border-bottom: none; padding-bottom: 0;">${escapeHtml(sec.title)}</h3>` : ''}
                    ${sec.subtitle ? `<p style="font-style: italic; font-size: 13.5px; color: #5a2e2e; margin-bottom: 12px; margin-top: 0;">${escapeHtml(sec.subtitle)}</p>` : ''}
                    ${sec.items && sec.items.length ? `
                    <ul style="list-style: disc; padding-left: 22px; color: #3b221e; font-size: 13.5px; line-height: 1.8; margin: 0; flex: 1;">
                        ${sec.items.map(p => `<li>${escapeHtml(p)}</li>`).join('')}
                    </ul>` : ''}
                </div>
                `;
            }).join('');
        }

        renderTermsPage();
        document.addEventListener('DOMContentLoaded', renderTermsPage);
    </script>
</body>

</html>
