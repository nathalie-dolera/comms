<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="100%" stop-color="#fda085"/>
    </linearGradient>
    <linearGradient id="seal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1c40f"/>
      <stop offset="100%" stop-color="#d35400"/>
    </linearGradient>
  </defs>
  <!-- Certificate Background -->
  <rect x="5" y="5" width="310" height="210" rx="4" fill="#faf7f2" stroke="#d4af37" stroke-width="2"/>
  <rect x="12" y="12" width="296" height="196" rx="2" fill="none" stroke="#2c3e50" stroke-width="0.8" stroke-dasharray="3,2"/>
  
  <!-- Header -->
  <text x="160" y="38" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="13" font-weight="bold" fill="#1a252f" letter-spacing="1.5">MICROSOFT CERTIFIED</text>
  <text x="160" y="52" text-anchor="middle" font-family="'Special Elite', monospace" font-size="9" fill="#7f8c8d" letter-spacing="1">OFFICE SPECIALIST</text>

  <!-- Awarded to -->
  <text x="160" y="78" text-anchor="middle" font-family="sans-serif" font-size="7.5" fill="#95a5a6">THIS IS PRESENTED TO</text>
  <text x="160" y="98" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="16" font-style="italic" font-weight="bold" fill="#8b2e2e">Thalie</text>
  <line x1="80" y1="104" x2="240" y2="104" stroke="#bdc3c7" stroke-width="0.8"/>

  <!-- Details -->
  <text x="160" y="122" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#2c3e50" font-weight="600">Microsoft Word &amp; PowerPoint Associate</text>
  <text x="160" y="136" text-anchor="middle" font-family="sans-serif" font-size="7.5" fill="#7f8c8d">Demonstrating advanced expertise in document preparation</text>

  <!-- Seal -->
  <circle cx="60" cy="168" r="22" fill="url(#seal-grad)" stroke="#b7950b" stroke-width="1.5"/>
  <circle cx="60" cy="168" r="18" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="2,1"/>
  <polygon points="60,154 63,163 72,163 65,168 67,177 60,172 53,177 55,168 48,163 57,163" fill="#ffffff"/>

  <!-- Signature Lines -->
  <line x1="190" y1="178" x2="280" y2="178" stroke="#34495e" stroke-width="0.8"/>
  <path d="M 200 174 Q 215 160 230 174 T 260 170" fill="none" stroke="#2c3e50" stroke-width="1.2"/>
  <text x="235" y="190" text-anchor="middle" font-family="'Special Elite', monospace" font-size="7" fill="#7f8c8d">AUTHORIZED SIGNATURE</text>
</svg>

