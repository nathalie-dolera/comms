  <text x="625" y="550" font-family="sans-serif" font-size="12" fill="#888">Genoise with diplomat cream</text>
  <text x="625" y="575" font-family="'Special Elite', monospace" font-size="13" font-weight="bold" fill="#6b1814">₱ 380.00</text>
