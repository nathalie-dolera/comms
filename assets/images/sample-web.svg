  <text x="85" y="575" font-family="'Special Elite', monospace" font-size="13" font-weight="bold" fill="#6b1814">₱ 140.00</text>

  <!-- Card 2 -->
  <rect x="335" y="395" width="230" height="195" rx="6" fill="#ffffff" stroke="#e8ded4" stroke-width="1.5"/>
  <rect x="335" y="395" width="230" height="110" rx="6" fill="#f6ece2"/>
  <text x="450" y="455" font-family="'Special Elite', monospace" font-size="12" fill="#8c5b52" text-anchor="middle">Country Sourdough</text>
  <text x="355" y="530" font-family="'Playfair Display', serif" font-size="15" font-weight="bold" fill="#4a1512">Artisan Country Batard</text>
