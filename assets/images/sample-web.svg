  <text x="65" y="375" font-family="'Playfair Display', serif" font-size="20" font-weight="bold" fill="#4a1512">Featured Baked Goods</text>
  
  <!-- Card 1 -->
  <rect x="65" y="395" width="230" height="195" rx="6" fill="#ffffff" stroke="#e8ded4" stroke-width="1.5"/>
