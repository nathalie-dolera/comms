  </defs>
  <rect width="900" height="650" fill="#f4ede4"/>
  <!-- Browser Window Frame -->
  <rect x="30" y="30" width="840" height="590" rx="10" fill="#ffffff" filter="url(#bShadow)" stroke="#dcd0c2"/>
  
  <!-- Browser Chrome Top Bar -->
