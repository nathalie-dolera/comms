  <text x="65" y="185" font-family="'Playfair Display', serif" font-size="34" font-weight="900" fill="#4a1512">Freshly Baked Every Morning</text>
  <text x="65" y="215" font-family="sans-serif" font-size="14" fill="#7d6059">Artisanal sourdough, flaky croissants, and delicate Parisian macarons crafted with local ingredients.</text>
  <rect x="65" y="240" width="140" height="38" rx="4" fill="#6b1814"/>
  <text x="135" y="264" font-family="'Special Elite', monospace" font-size="12" fill="#ffffff" text-anchor="middle">ORDER ONLINE →</text>
