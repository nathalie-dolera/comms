  <circle cx="55" cy="52" r="6" fill="#e06c75"/>
  <circle cx="75" cy="52" r="6" fill="#e5c07b"/>
  <circle cx="95" cy="52" r="6" fill="#98c379"/>
  <rect x="130" y="42" width="550" height="22" rx="11" fill="#ffffff"/>
  <text x="150" y="57" font-family="'Special Elite', monospace" font-size="11" fill="#887770">https://www.artisanalbakery.ph/menu</text>

  <!-- Website Navbar -->
  <rect x="30" y="75" width="840" height="55" fill="#5c1511"/>
  <text x="60" y="110" font-family="'Playfair Display', serif" font-size="20" font-weight="bold" fill="#ffffff">LA PETITE BOULANGERIE</text>
  <text x="560" y="108" font-family="sans-serif" font-size="12" fill="#f5ede4">Home</text>
  <text x="620" y="108" font-family="sans-serif" font-size="12" fill="#f5ede4" font-weight="bold">Pastries</text>
  <text x="690" y="108" font-family="sans-serif" font-size="12" fill="#f5ede4">Custom Cakes</text>
