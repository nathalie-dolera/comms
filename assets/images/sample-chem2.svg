<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <defs>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="#faf6f0"/>
  <rect x="25" y="25" width="750" height="950" fill="#ffffff" rx="4" filter="url(#shadow2)"/>
  
  <rect x="45" y="45" width="710" height="90" rx="3" fill="#6b1814"/>
  <text x="70" y="85" font-family="'Playfair Display', Georgia, serif" font-size="26" font-weight="bold" fill="#ffffff">ORGANIC CHEMISTRY REVIEWER</text>
  <text x="70" y="112" font-family="'Special Elite', monospace" font-size="13" fill="#f5ede4" letter-spacing="1">UNIT 05: CARBONYL CONDENSATION &amp; ENOLATE CHEMISTRY</text>
  <rect x="630" y="65" width="105" height="40" rx="20" fill="#8c2e28"/>
  <text x="682" y="90" font-family="'Special Elite', monospace" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">PAGE 02</text>

  <text x="50" y="175" font-family="'Playfair Display', Georgia, serif" font-size="18" font-weight="bold" fill="#4a1512">1. Aldol Addition &amp; Condensation Mechanism</text>
  <line x1="50" y1="185" x2="750" y2="185" stroke="#dcd0c2" stroke-width="1.5"/>

  <rect x="50" y="205" width="700" height="260" rx="4" fill="#fdfbf7" stroke="#e6dcd0" stroke-width="1"/>
  <text x="70" y="235" font-family="'Special Elite', monospace" font-size="13" font-weight="bold" fill="#6b1814">Step-by-Step Enolate Generation:</text>
  
  <rect x="70" y="255" width="190" height="100" rx="4" fill="#fff" stroke="#dcd0c2"/>
  <text x="85" y="280" font-family="monospace" font-size="12" fill="#4a1512">CH3-CHO + Base</text>
  <text x="85" y="305" font-family="sans-serif" font-size="10" fill="#777">Deprotonation of alpha-H</text>
  <text x="85" y="335" font-family="'Special Elite', monospace" font-size="11" fill="#6b1814">--&gt; Enolate Resonance</text>

  <text x="280" y="310" font-family="monospace" font-size="22" fill="#6b1814" font-weight="bold">→</text>

  <rect x="320" y="255" width="190" height="100" rx="4" fill="#fff" stroke="#dcd0c2"/>
  <text x="335" y="280" font-family="monospace" font-size="12" fill="#4a1512">Nucleophilic Attack</text>
  <text x="335" y="305" font-family="sans-serif" font-size="10" fill="#777">Enolate attacks 2nd aldehyde</text>
  <text x="335" y="335" font-family="'Special Elite', monospace" font-size="11" fill="#6b1814">--&gt; Alkoxide Ion</text>

  <text x="530" y="310" font-family="monospace" font-size="22" fill="#6b1814" font-weight="bold">→</text>

  <rect x="560" y="255" width="170" height="100" rx="4" fill="#fff" stroke="#dcd0c2"/>
  <text x="575" y="280" font-family="monospace" font-size="12" fill="#4a1512">Protonation</text>
  <text x="575" y="305" font-family="sans-serif" font-size="10" fill="#777">Forms beta-hydroxy aldehyde</text>
  <text x="575" y="335" font-family="'Special Elite', monospace" font-size="11" fill="#2d6a4f">Aldol Product</text>

  <rect x="70" y="375" width="660" height="70" rx="4" fill="#fdfaf6" stroke="#c4615a" stroke-dasharray="3,3"/>
  <text x="90" y="405" font-family="'Special Elite', monospace" font-size="12" font-weight="bold" fill="#6b1814">Dehydration (Heating):</text>
  <text x="90" y="425" font-family="sans-serif" font-size="11" fill="#4a2520">Beta-hydroxy aldehyde loses water (E1cB mechanism) to form conjugated alpha,beta-unsaturated enal.</text>

  <text x="50" y="505" font-family="'Playfair Display', Georgia, serif" font-size="18" font-weight="bold" fill="#4a1512">2. Synthesis Practice Roadmaps</text>
  <line x1="50" y1="515" x2="750" y2="515" stroke="#dcd0c2" stroke-width="1.5"/>

  <rect x="50" y="535" width="700" height="380" rx="4" fill="#ffffff" stroke="#e0d6cb"/>
  <text x="75" y="565" font-family="'Special Elite', monospace" font-size="13" font-weight="bold" fill="#6b1814">Retrosynthetic Analysis Worksheet</text>
  
  <rect x="75" y="585" width="310" height="140" rx="4" fill="#fdfbf7" stroke="#e6dcd0"/>
  <text x="90" y="610" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4a1512">Target Molecule: 4-Phenylbut-3-en-2-one</text>
  <text x="90" y="635" font-family="sans-serif" font-size="11" fill="#555">Starting Materials:</text>
  <text x="90" y="660" font-family="monospace" font-size="11" fill="#6b1814">• Benzaldehyde (Ph-CHO)</text>
  <text x="90" y="685" font-family="monospace" font-size="11" fill="#6b1814">• Acetone (CH3-CO-CH3)</text>
  <text x="90" y="710" font-family="sans-serif" font-size="10" fill="#2d6a4f">Reaction: Claisen-Schmidt Condensation</text>

  <rect x="415" y="585" width="310" height="140" rx="4" fill="#fdfbf7" stroke="#e6dcd0"/>
  <text x="430" y="610" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4a1512">Target Molecule: Ethyl Acetoacetate</text>
  <text x="430" y="635" font-family="sans-serif" font-size="11" fill="#555">Starting Materials:</text>
  <text x="430" y="660" font-family="monospace" font-size="11" fill="#6b1814">• 2x Ethyl Acetate (CH3COOEt)</text>
  <text x="430" y="685" font-family="monospace" font-size="11" fill="#6b1814">• Base: Sodium Ethoxide (NaOEt)</text>
  <text x="430" y="710" font-family="sans-serif" font-size="10" fill="#2d6a4f">Reaction: Claisen Ester Condensation</text>

  <rect x="75" y="745" width="650" height="145" rx="4" fill="#fcf6f4" stroke="#dcd0c2"/>
  <text x="95" y="775" font-family="'Special Elite', monospace" font-size="12" font-weight="bold" fill="#6b1814">EXAM STRATEGY CHECKLIST:</text>
  <text x="95" y="805" font-family="sans-serif" font-size="11" fill="#555">✓ Count total carbons before and after the condensation.</text>
  <text x="95" y="830" font-family="sans-serif" font-size="11" fill="#555">✓ Conjugation drives equilibrium forward even when intermediate addition is reversible.</text>
  <text x="95" y="855" font-family="sans-serif" font-size="11" fill="#555">✓ Crossed aldol requires one partner without alpha-hydrogens (e.g., formaldehyde or benzaldehyde).</text>

  <text x="400" y="955" font-family="'Dancing Script', cursive" font-size="18" fill="#a07a75" text-anchor="middle">prepared by Thalie — Academic Commission Services</text>
</svg>
