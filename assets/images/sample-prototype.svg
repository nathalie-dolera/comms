<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
  <defs>
    <filter id="protoShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="900" height="650" fill="#2d0a0a"/>
  
  <!-- Main Dashboard Container -->
  <rect x="40" y="35" width="820" height="580" rx="10" fill="#ffffff" filter="url(#protoShadow)"/>
  
  <!-- Sidebar -->
  <path d="M 40,45 Q 40,35 50,35 L 230,35 L 230,615 L 50,615 Q 40,615 40,605 Z" fill="#4a1212"/>
  <circle cx="70" cy="75" r="16" fill="#c4615a"/>
  <text x="70" y="80" font-family="'Special Elite', monospace" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">SP</text>
  <text x="96" y="80" font-family="'Playfair Display', serif" font-size="16" font-weight="bold" fill="#fff">StudentPortal</text>
  
  <!-- Sidebar Navigation -->
  <rect x="52" y="125" width="166" height="36" rx="6" fill="#6b1814"/>
  <text x="70" y="148" font-family="sans-serif" font-size="12" fill="#fff" font-weight="bold">Dashboard</text>
  <text x="70" y="185" font-family="sans-serif" font-size="12" fill="#d4847e">Class Schedule</text>
  <text x="70" y="220" font-family="sans-serif" font-size="12" fill="#d4847e">Grades &amp; GWA</text>
  <text x="70" y="255" font-family="sans-serif" font-size="12" fill="#d4847e">Subject Enrollment</text>
  <text x="70" y="290" font-family="sans-serif" font-size="12" fill="#d4847e">Clearance Status</text>
  <text x="70" y="325" font-family="sans-serif" font-size="12" fill="#d4847e">Document Requests</text>

  <!-- Top bar in dashboard -->
