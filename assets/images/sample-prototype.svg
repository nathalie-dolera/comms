  <text x="260" y="73" font-family="'Playfair Display', serif" font-size="20" font-weight="bold" fill="#4a1512">Welcome back, Nathalie</text>
  <text x="260" y="90" font-family="sans-serif" font-size="11" fill="#8c5b52">BS Information Technology • 3rd Year Standing</text>
  <circle cx="815" cy="67" r="18" fill="#e6d5c5"/>
  <text x="815" y="72" font-family="'Special Elite', monospace" font-size="11" fill="#4a1512" text-anchor="middle">NP</text>

  <!-- Stat Cards -->
  <!-- Stat 1 -->
  <rect x="260" y="125" width="175" height="90" rx="6" fill="#fdfaf6" stroke="#e8ded4"/>
  <text x="280" y="152" font-family="'Special Elite', monospace" font-size="10" fill="#8c5b52" text-transform="uppercase">Current GWA</text>
  <text x="280" y="188" font-family="'Playfair Display', serif" font-size="28" font-weight="900" fill="#2d6a4f">1.18</text>
  <text x="280" y="204" font-family="sans-serif" font-size="10" fill="#2d6a4f">President's Lister</text>

  <!-- Stat 2 -->
  <rect x="455" y="125" width="175" height="90" rx="6" fill="#fdfaf6" stroke="#e8ded4"/>
  <text x="475" y="152" font-family="'Special Elite', monospace" font-size="10" fill="#8c5b52" text-transform="uppercase">Enrolled Units</text>
  <text x="475" y="188" font-family="'Playfair Display', serif" font-size="28" font-weight="900" fill="#4a1512">21.0</text>
  <text x="475" y="204" font-family="sans-serif" font-size="10" fill="#777">7 Subjects Total</text>

  <!-- Stat 3 -->
  <rect x="650" y="125" width="180" height="90" rx="6" fill="#fdfaf6" stroke="#e8ded4"/>
  <text x="670" y="152" font-family="'Special Elite', monospace" font-size="10" fill="#8c5b52" text-transform="uppercase">Clearance</text>
  <text x="670" y="188" font-family="'Playfair Display', serif" font-size="24" font-weight="900" fill="#6b1814">Complete</text>
  <text x="670" y="204" font-family="sans-serif" font-size="10" fill="#2d6a4f">Ready for Next Term</text>

  <!-- Enrolled Subjects Table Card -->
  <rect x="260" y="235" width="570" height="240" rx="6" fill="#ffffff" stroke="#e8ded4"/>
  <text x="280" y="265" font-family="'Playfair Display', serif" font-size="16" font-weight="bold" fill="#4a1512">Enrolled Subjects &amp; Grade Evaluation</text>
  
  <rect x="270" y="280" width="550" height="28" rx="4" fill="#f6ece2"/>
  <text x="285" y="298" font-family="'Special Elite', monospace" font-size="10" fill="#6b1814" font-weight="bold">CODE</text>
  <text x="365" y="298" font-family="'Special Elite', monospace" font-size="10" fill="#6b1814" font-weight="bold">SUBJECT DESCRIPTION</text>
  <text x="620" y="298" font-family="'Special Elite', monospace" font-size="10" fill="#6b1814" font-weight="bold">UNITS</text>
  <text x="720" y="298" font-family="'Special Elite', monospace" font-size="10" fill="#6b1814" font-weight="bold">GRADE</text>

  <text x="285" y="330" font-family="sans-serif" font-size="11" fill="#444">IT 301</text>
  <text x="365" y="330" font-family="sans-serif" font-size="11" fill="#444">Web Systems and Technologies</text>
  <text x="620" y="330" font-family="sans-serif" font-size="11" fill="#444">3.0</text>
  <text x="720" y="330" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2d6a4f">1.00</text>
  <line x1="280" y1="342" x2="810" y2="342" stroke="#f0e6dc"/>

  <text x="285" y="365" font-family="sans-serif" font-size="11" fill="#444">IT 302</text>
  <text x="365" y="365" font-family="sans-serif" font-size="11" fill="#444">Information Assurance &amp; Security</text>
  <text x="620" y="365" font-family="sans-serif" font-size="11" fill="#444">3.0</text>
  <text x="720" y="365" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2d6a4f">1.25</text>
  <line x1="280" y1="377" x2="810" y2="377" stroke="#f0e6dc"/>

  <text x="285" y="400" font-family="sans-serif" font-size="11" fill="#444">IT 303</text>
  <text x="365" y="400" font-family="sans-serif" font-size="11" fill="#444">Human Computer Interaction (UI/UX)</text>
  <text x="620" y="400" font-family="sans-serif" font-size="11" fill="#444">3.0</text>
  <text x="720" y="400" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2d6a4f">1.00</text>
  <line x1="280" y1="412" x2="810" y2="412" stroke="#f0e6dc"/>

  <text x="285" y="435" font-family="sans-serif" font-size="11" fill="#444">IT 304</text>
  <text x="365" y="435" font-family="sans-serif" font-size="11" fill="#444">Mobile Application Development</text>
  <text x="620" y="435" font-family="sans-serif" font-size="11" fill="#444">3.0</text>
  <text x="720" y="435" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2d6a4f">1.25</text>

  <!-- Prototype Banner -->
  <rect x="260" y="495" width="570" height="90" rx="6" fill="#fdf3e7" stroke="#c4615a" stroke-dasharray="4,4"/>
  <text x="280" y="530" font-family="'Special Elite', monospace" font-size="13" font-weight="bold" fill="#6b1814">FIGMA PROTOTYPE SPECIFICATION:</text>
  <text x="280" y="555" font-family="sans-serif" font-size="11" fill="#66504b">Responsive desktop (1440px) &amp; mobile viewports • WCAG AA contrast compliance • Interactive micro-interactions</text>
</svg>
