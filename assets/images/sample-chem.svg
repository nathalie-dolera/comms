<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background Paper -->
  <rect width="800" height="1000" fill="#faf6f0"/>
  <rect x="25" y="25" width="750" height="950" fill="#ffffff" rx="4" filter="url(#shadow)"/>
  
  <!-- Header Bar -->
  <rect x="45" y="45" width="710" height="90" rx="3" fill="#6b1814"/>
  <text x="70" y="85" font-family="'Playfair Display', Georgia, serif" font-size="26" font-weight="bold" fill="#ffffff">ORGANIC CHEMISTRY REVIEWER</text>
  <text x="70" y="112" font-family="'Special Elite', monospace" font-size="13" fill="#f5ede4" letter-spacing="1">UNIT 04: HYDROCARBONS &amp; REACTION MECHANISMS</text>
  <rect x="630" y="65" width="105" height="40" rx="20" fill="#8c2e28"/>
  <text x="682" y="90" font-family="'Special Elite', monospace" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">PAGE 01</text>

  <!-- Section 1: Core Concepts -->
  <text x="50" y="175" font-family="'Playfair Display', Georgia, serif" font-size="18" font-weight="bold" fill="#4a1512">1. Electrophilic Aromatic Substitution (EAS)</text>
  <line x1="50" y1="185" x2="750" y2="185" stroke="#dcd0c2" stroke-width="1.5"/>

  <!-- Benzene Diagram Card -->
  <rect x="50" y="205" width="335" height="190" rx="4" fill="#fdfbf7" stroke="#e6dcd0" stroke-width="1"/>
  <text x="65" y="230" font-family="'Special Elite', monospace" font-size="12" font-weight="bold" fill="#6b1814">Mechanism Step 1: Arenium Ion Formation</text>
  <!-- Benzene ring -->
  <polygon points="120,290 145,246 195,246 220,290 195,334 145,334" fill="none" stroke="#4a1512" stroke-width="2.5"/>
  <circle cx="170" cy="290" r="28" fill="none" stroke="#4a1512" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="240" y="295" font-family="monospace" font-size="20" fill="#6b1814" font-weight="bold">+</text>
  <text x="265" y="295" font-family="monospace" font-size="18" fill="#c4615a" font-weight="bold">E<tspan dy="-8" font-size="12">+</tspan></text>
  <path d="M 295,290 L 330,290 M 325,285 L 330,290 L 325,295" fill="none" stroke="#6b1814" stroke-width="2"/>
  <text x="65" y="375" font-family="sans-serif" font-size="11" fill="#665550">Resonance-stabilized carbocation (sigma complex)</text>

  <!-- Summary Table Card -->
  <rect x="405" y="205" width="345" height="190" rx="4" fill="#fdfbf7" stroke="#e6dcd0" stroke-width="1"/>
  <text x="420" y="230" font-family="'Special Elite', monospace" font-size="12" font-weight="bold" fill="#6b1814">Key Functional Groups Summary</text>
  <line x1="420" y1="240" x2="735" y2="240" stroke="#dcd0c2"/>
  <text x="425" y="260" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4a1512">Group</text>
  <text x="530" y="260" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4a1512">Structure</text>
  <text x="640" y="260" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4a1512">Directing</text>
  <line x1="420" y1="270" x2="735" y2="270" stroke="#eee"/>
  <text x="425" y="295" font-family="sans-serif" font-size="11" fill="#444">-OH (Alcohol)</text>
  <text x="530" y="295" font-family="monospace" font-size="11" fill="#6b1814">R-OH</text>
  <text x="640" y="295" font-family="sans-serif" font-size="11" fill="#2d6a4f">Ortho/Para</text>
  <line x1="420" y1="310" x2="735" y2="310" stroke="#eee"/>
  <text x="425" y="335" font-family="sans-serif" font-size="11" fill="#444">-NO2 (Nitro)</text>
  <text x="530" y="335" font-family="monospace" font-size="11" fill="#6b1814">R-NO2</text>
  <text x="640" y="335" font-family="sans-serif" font-size="11" fill="#b02a37">Meta</text>
  <line x1="420" y1="350" x2="735" y2="350" stroke="#eee"/>
  <text x="425" y="375" font-family="sans-serif" font-size="11" fill="#444">-CH3 (Alkyl)</text>
  <text x="530" y="375" font-family="monospace" font-size="11" fill="#6b1814">R-CH3</text>
  <text x="640" y="375" font-family="sans-serif" font-size="11" fill="#2d6a4f">Ortho/Para</text>

  <!-- Section 2: Reaction Pathways -->
  <text x="50" y="435" font-family="'Playfair Display', Georgia, serif" font-size="18" font-weight="bold" fill="#4a1512">2. Nucleophilic Substitution (SN1 vs SN2)</text>
  <line x1="50" y1="445" x2="750" y2="445" stroke="#dcd0c2" stroke-width="1.5"/>

  <rect x="50" y="465" width="700" height="230" rx="4" fill="#fff" stroke="#e0d6cb" stroke-width="1"/>
  <!-- Table Header -->
  <rect x="50" y="465" width="700" height="35" rx="4" fill="#f5ebe8"/>
  <text x="70" y="488" font-family="'Special Elite', monospace" font-size="12" font-weight="bold" fill="#6b1814">FEATURE</text>
  <text x="300" y="488" font-family="'Special Elite', monospace" font-size="12" font-weight="bold" fill="#6b1814">SN1 (UNIMOLECULAR)</text>
  <text x="530" y="488" font-family="'Special Elite', monospace" font-size="12" font-weight="bold" fill="#6b1814">SN2 (BIMOLECULAR)</text>
  <line x1="50" y1="500" x2="750" y2="500" stroke="#dcd0c2"/>
  
  <text x="70" y="530" font-family="sans-serif" font-size="12" font-weight="bold" fill="#444">Kinetics</text>
  <text x="300" y="530" font-family="sans-serif" font-size="12" fill="#555">Rate = k[substrate]</text>
  <text x="530" y="530" font-family="sans-serif" font-size="12" fill="#555">Rate = k[substrate][nucleophile]</text>
  <line x1="70" y1="545" x2="730" y2="545" stroke="#eee"/>

  <text x="70" y="575" font-family="sans-serif" font-size="12" font-weight="bold" fill="#444">Number of Steps</text>
  <text x="300" y="575" font-family="sans-serif" font-size="12" fill="#555">2 steps (via Carbocation)</text>
  <text x="530" y="575" font-family="sans-serif" font-size="12" fill="#555">1 concerted step</text>
  <line x1="70" y1="590" x2="730" y2="590" stroke="#eee"/>

  <text x="70" y="620" font-family="sans-serif" font-size="12" font-weight="bold" fill="#444">Stereochemistry</text>
  <text x="300" y="620" font-family="sans-serif" font-size="12" fill="#555">Racemization (Inversion + Retention)</text>
  <text x="530" y="620" font-family="sans-serif" font-size="12" fill="#555">Complete Walden Inversion</text>
  <line x1="70" y1="635" x2="730" y2="635" stroke="#eee"/>

  <text x="70" y="665" font-family="sans-serif" font-size="12" font-weight="bold" fill="#444">Substrate Preference</text>
  <text x="300" y="665" font-family="sans-serif" font-size="12" fill="#6b1814" font-weight="bold">3° &gt; 2° &gt; 1° &gt; Methyl</text>
  <text x="530" y="665" font-family="sans-serif" font-size="12" fill="#6b1814" font-weight="bold">Methyl &gt; 1° &gt; 2° &gt; 3°</text>

  <!-- Section 3: Study Notes & Key Formulas -->
  <rect x="50" y="725" width="700" height="190" rx="4" fill="#fdfaf6" stroke="#c4615a" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="70" y="755" font-family="'Special Elite', monospace" font-size="13" font-weight="bold" fill="#6b1814">IMPORTANT EXAM REMINDERS:</text>
  <text x="70" y="785" font-family="sans-serif" font-size="12" fill="#4a2520">• Always check solvent polarity: Polar Protic favors SN1, Polar Aprotic favors SN2.</text>
  <text x="70" y="810" font-family="sans-serif" font-size="12" fill="#4a2520">• Watch for hydride or methyl shifts during secondary carbocation intermediates.</text>
  <text x="70" y="835" font-family="sans-serif" font-size="12" fill="#4a2520">• Zaitsev's rule: Elimination yields the most substituted, thermodynamically stable alkene.</text>
  <text x="70" y="860" font-family="sans-serif" font-size="12" fill="#4a2520">• Aromaticity test: 4n + 2 pi electrons (Hückel's Rule), cyclic, planar, completely conjugated.</text>

  <!-- Watermark / Footer -->
  <text x="400" y="950" font-family="'Dancing Script', cursive" font-size="18" fill="#a07a75" text-anchor="middle">prepared by Thalie — Academic Commission Services</text>
</svg>
