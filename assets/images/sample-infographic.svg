<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <defs>
    <filter id="infoShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="#faf5ee"/>
  <rect x="25" y="25" width="750" height="950" fill="#ffffff" rx="6" filter="url(#infoShadow)"/>

  <!-- Top Hero Banner -->
  <rect x="25" y="25" width="750" height="120" rx="6" fill="#6b1814"/>
  <text x="400" y="75" font-family="'Playfair Display', serif" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">PHILIPPINE HISTORY TIMELINE</text>
  <text x="400" y="105" font-family="'Special Elite', monospace" font-size="13" fill="#fdf0d5" letter-spacing="2" text-anchor="middle">VISUAL GUIDE TO MAJOR HISTORICAL ERAS</text>

  <!-- Timeline Center Line -->
  <line x1="400" y1="180" x2="400" y2="880" stroke="#c4615a" stroke-width="3" stroke-dasharray="6,4"/>

  <!-- Era 1: Pre-Colonial Period -->
  <circle cx="400" cy="220" r="14" fill="#6b1814" stroke="#ffffff" stroke-width="3"/>
  <rect x="60" y="180" width="300" height="110" rx="6" fill="#fdfbf7" stroke="#e0d0c0"/>
  <text x="80" y="210" font-family="'Special Elite', monospace" font-size="12" font-weight="bold" fill="#6b1814">BEFORE 1521</text>
  <text x="80" y="235" font-family="'Playfair Display', serif" font-size="16" font-weight="bold" fill="#4a1512">Pre-Colonial Societies</text>
  <text x="80" y="260" font-family="sans-serif" font-size="11" fill="#665550">Barangay system, Baybayin script, maritime trade with China, India, and Arab merchants.</text>

  <!-- Era 2: Spanish Era -->
  <circle cx="400" cy="360" r="14" fill="#6b1814" stroke="#ffffff" stroke-width="3"/>
  <rect x="440" y="320" width="300" height="110" rx="6" fill="#fdfbf7" stroke="#e0d0c0"/>
  <text x="460" y="350" font-family="'Special Elite', monospace" font-size="12" font-weight="bold" fill="#6b1814">1521 – 1898</text>
  <text x="460" y="375" font-family="'Playfair Display', serif" font-size="16" font-weight="bold" fill="#4a1512">Spanish Colonization</text>
  <text x="460" y="400" font-family="sans-serif" font-size="11" fill="#665550">Galleon Trade, Christianization, Propaganda Movement, and the 1896 Philippine Revolution.</text>

  <!-- Era 3: First Republic -->
  <circle cx="400" cy="500" r="14" fill="#6b1814" stroke="#ffffff" stroke-width="3"/>
  <rect x="60" y="460" width="300" height="110" rx="6" fill="#fdfbf7" stroke="#e0d0c0"/>
  <text x="80" y="490" font-family="'Special Elite', monospace" font-size="12" font-weight="bold" fill="#6b1814">1898 – 1902</text>
  <text x="80" y="515" font-family="'Playfair Display', serif" font-size="16" font-weight="bold" fill="#4a1512">Declaration of Independence</text>
  <text x="80" y="540" font-family="sans-serif" font-size="11" fill="#665550">Kawit Cavite declaration on June 12, Malolos Congress, and the Philippine-American War.</text>

  <!-- Era 4: American & Commonwealth -->
  <circle cx="400" cy="640" r="14" fill="#6b1814" stroke="#ffffff" stroke-width="3"/>
  <rect x="440" y="600" width="300" height="110" rx="6" fill="#fdfbf7" stroke="#e0d0c0"/>
  <text x="460" y="630" font-family="'Special Elite', monospace" font-size="12" font-weight="bold" fill="#6b1814">1902 – 1946</text>
  <text x="460" y="655" font-family="'Playfair Display', serif" font-size="16" font-weight="bold" fill="#4a1512">American &amp; Commonwealth</text>
  <text x="460" y="680" font-family="sans-serif" font-size="11" fill="#665550">Public school system, English language, 1935 Constitution, and WWII Japanese Occupation.</text>

  <!-- Era 5: Contemporary Era -->
  <circle cx="400" cy="780" r="14" fill="#6b1814" stroke="#ffffff" stroke-width="3"/>
  <rect x="60" y="740" width="300" height="110" rx="6" fill="#fdfbf7" stroke="#e0d0c0"/>
  <text x="80" y="770" font-family="'Special Elite', monospace" font-size="12" font-weight="bold" fill="#6b1814">1946 – PRESENT</text>
  <text x="80" y="795" font-family="'Playfair Display', serif" font-size="16" font-weight="bold" fill="#4a1512">Third to Fifth Republic</text>
  <text x="80" y="820" font-family="sans-serif" font-size="11" fill="#665550">Post-war rebuilding, 1986 EDSA People Power, and 1987 Philippine Constitution.</text>

  <!-- Footer -->
  <line x1="60" y1="910" x2="740" y2="910" stroke="#e0d0c0"/>
  <text x="400" y="945" font-family="'Dancing Script', cursive" font-size="18" fill="#8c5b52" text-anchor="middle">designed by Thalie — Graphic Design &amp; Infographic Services</text>
</svg>
