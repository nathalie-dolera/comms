<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- Background -->
  <rect width="300" height="300" fill="#8b2e2e" rx="4"/>
  
  <!-- Butterfly wings (back) -->
  <ellipse cx="100" cy="130" rx="55" ry="65" fill="#e87c9a" opacity="0.8" transform="rotate(-15 100 130)"/>
  <ellipse cx="200" cy="130" rx="55" ry="65" fill="#e87c9a" opacity="0.8" transform="rotate(15 200 130)"/>
  <ellipse cx="105" cy="190" rx="35" ry="45" fill="#e87c9a" opacity="0.7" transform="rotate(-10 105 190)"/>
  <ellipse cx="195" cy="190" rx="35" ry="45" fill="#e87c9a" opacity="0.7" transform="rotate(10 195 190)"/>
  
  <!-- Wing patterns -->
  <ellipse cx="100" cy="125" rx="30" ry="35" fill="#c94070" opacity="0.5" transform="rotate(-15 100 125)"/>
  <ellipse cx="200" cy="125" rx="30" ry="35" fill="#c94070" opacity="0.5" transform="rotate(15 200 125)"/>
  <circle cx="95" cy="115" r="12" fill="#9b2d5e" opacity="0.6"/>
  <circle cx="205" cy="115" r="12" fill="#9b2d5e" opacity="0.6"/>
  <circle cx="95" cy="115" r="6" fill="#e87c9a" opacity="0.4"/>
  <circle cx="205" cy="115" r="6" fill="#e87c9a" opacity="0.4"/>
  
  <!-- Body -->
  <ellipse cx="150" cy="200" rx="18" ry="35" fill="#1a1a2e"/>
  
  <!-- Head -->
  <circle cx="150" cy="150" r="55" fill="#fce4d6"/>
  
  <!-- Hair -->
  <path d="M95 150 Q95 85 150 80 Q205 85 205 150 Q200 100 150 95 Q100 100 95 150Z" fill="#1a1a2e"/>
  <path d="M95 150 Q90 180 85 210 Q88 190 95 170Z" fill="#1a1a2e"/>
  <path d="M205 150 Q210 180 215 210 Q212 190 205 170Z" fill="#1a1a2e"/>
  <!-- Side hair -->
  <path d="M95 130 Q80 160 78 200 Q85 175 95 155Z" fill="#1a1a2e"/>
  <path d="M205 130 Q220 160 222 200 Q215 175 205 155Z" fill="#1a1a2e"/>
  
  <!-- Eyes -->
  <circle cx="132" cy="155" r="18" fill="#6b1e1e"/>
  <circle cx="168" cy="155" r="18" fill="#6b1e1e"/>
  <circle cx="132" cy="155" r="14" fill="#8b2e2e"/>
  <circle cx="168" cy="155" r="14" fill="#8b2e2e"/>
  <!-- Eye shine -->
  <circle cx="127" cy="150" r="5" fill="white" opacity="0.8"/>
  <circle cx="163" cy="150" r="5" fill="white" opacity="0.8"/>
  <circle cx="135" cy="158" r="3" fill="white" opacity="0.5"/>
  <circle cx="171" cy="158" r="3" fill="white" opacity="0.5"/>
  
  <!-- Blush -->
  <ellipse cx="118" cy="170" rx="10" ry="6" fill="#e8a0a0" opacity="0.5"/>
  <ellipse cx="182" cy="170" rx="10" ry="6" fill="#e8a0a0" opacity="0.5"/>
  
  <!-- Smile -->
  <path d="M140 175 Q150 185 160 175" fill="none" stroke="#6b1e1e" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Antennae -->
  <line x1="135" y1="95" x2="120" y2="60" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
  <line x1="165" y1="95" x2="180" y2="60" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round"/>
  <circle cx="120" cy="57" r="6" fill="#e87c9a"/>
  <circle cx="180" cy="57" r="6" fill="#e87c9a"/>
  
  <!-- Stars on hair -->
  <polygon points="110,105 112,100 114,105 119,105 115,109 117,114 112,110 107,114 109,109 105,105" fill="#c9a0d4" opacity="0.8"/>
  <polygon points="186,105 188,100 190,105 195,105 191,109 193,114 188,110 183,114 185,109 181,105" fill="#c9a0d4" opacity="0.8"/>
</svg>

