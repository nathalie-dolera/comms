<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .admin-corner-link {
            position: fixed;
            bottom: 16px;
            right: 18px;
            background: var(--maroon-dark);
            border: 1px solid var(--rose);
            color: var(--rose-light);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-family: 'Special Elite', monospace;
            text-decoration: none;
            letter-spacing: 1px;
            transition: all 0.2s;
            z-index: 100;
        }

        .admin-corner-link:hover {
            background: var(--maroon);
            color: #fff;
            border-color: var(--rose);
        }

        .nav-buttons-expanded {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            width: 100%;
            max-width: 380px;
        }

        .nav-btn-highlight {
            background: var(--paper-warm) !important;
            border: 1px solid var(--rose);
        }
    </style>
</head>
<body>
    <!-- Background -->
    <div class="page-background"></div>

    <!-- Discreet Portal Link -->
    <a href="admin/index.html" class="admin-corner-link">Commissioner Portal</a>

    <!-- Main Folder -->
    <div class="folder-container">
        <div class="folder">

            <!-- Folder Content -->
            <div class="folder-content">

                <!-- Polaroid Photo -->
                <a href="pages/about.html" style="text-decoration:none;" title="About Me">
                    <div class="polaroid">
                        <div class="paperclip" aria-hidden="true">
                            <svg viewBox="0 0 32 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M 6 48 L 6 15 A 10 10 0 0 1 26 15 L 26 48 A 7 7 0 0 1 12 48 L 12 24 A 4 4 0 0 1 20 24 L 20 42" stroke="#8fa8b5" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                        <div class="polaroid-image">
                            <img id="polaroid-profile-img" src="assets/images/default-person.svg" alt="Profile Photo">
                        </div>
                        <span class="polaroid-label">about me</span>
                    </div>
                </a>

                <!-- Right Side -->
                <div class="folder-right">
                    <h1 class="portfolio-title" id="home-portfolio-title">YOUR NAME<br>PORTFOLIO</h1>

                    <!-- Navigation Buttons -->
                    <div class="nav-buttons nav-buttons-expanded">
                        <a href="pages/output.html" class="nav-btn">Output</a>
                        <a href="pages/feedback.html" class="nav-btn">Feedback</a>
                        <a href="pages/terms.html" class="nav-btn">T &amp; C</a>
                        <a href="pages/form.html" class="nav-btn">Form</a>
                        <a href="pages/form.html#additional-payment" class="nav-btn">Submit Payment</a>
                        <a href="pages/tracker.html" class="nav-btn nav-btn-highlight">Status &amp; Slots</a>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script>
        function updateHomeDisplay() {
            const settings = Storage.get(Storage.KEYS.SITE_SETTINGS, null);
            const titleEl = document.getElementById('home-portfolio-title');
            if (titleEl && settings && settings.portfolioTitle) {
                titleEl.innerHTML = settings.portfolioTitle.replace(/\n/g, '<br>');
            }

            const polaroidImg = document.getElementById('polaroid-profile-img');
            if (!polaroidImg) return;

            const imgSrc = settings?.homepageImage || settings?.profileImage;
            if (imgSrc) {
                polaroidImg.src = imgSrc;
            } else {
                polaroidImg.src = 'assets/images/default-person.svg';
            }
        }

        // Render immediately with local cache, then update on DOM load and when storage syncs
        updateHomeDisplay();
        document.addEventListener('DOMContentLoaded', updateHomeDisplay);
    </script>
</body>
</html>
